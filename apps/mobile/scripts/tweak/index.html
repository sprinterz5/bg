<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tweak</title>
<style>
  :root { --bg: #fff; --panel: #f6f6f7; --line: #e9e9e9; --text: #0f1419; --muted: #8a8f98; --accent: #1d9bf0; --changed: #fff6d6; --mark: #e2b100; --err: #e0245e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.35 Inter, system-ui, -apple-system, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  .app { display: flex; flex-direction: column; height: 100vh; }
  #dock { flex: 1; min-height: 0; display: flex; }
  .col { display: flex; flex-direction: column; min-width: 160px; min-height: 0; }
  .panel { display: flex; flex-direction: column; min-height: 60px; min-width: 0; position: relative; }
  .ph { height: 28px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 10px; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; background: var(--panel); border-bottom: 1px solid var(--line); cursor: grab; user-select: none; }
  .ph::before { content: '⠿'; font-size: 12px; letter-spacing: 0; }
  .pb { flex: 1; min-height: 0; overflow: auto; container-type: inline-size; }
  .vsplit { width: 5px; flex: none; cursor: col-resize; background: var(--line); }
  .hsplit { height: 5px; flex: none; cursor: row-resize; background: var(--line); }
  .vsplit:hover, .hsplit:hover { background: var(--accent); }
  .drop { position: absolute; pointer-events: none; background: rgba(29,155,240,.18); border: 2px solid var(--accent); z-index: 5; }
  body.dragging, body.dragging * { cursor: grabbing !important; user-select: none; }
  body.dragging iframe { pointer-events: none; }
  @container (max-width: 600px) { .row { grid-template-columns: minmax(110px, 1fr) auto !important; } .src { display: none; } }
  header { height: 52px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--line); }
  header b { font-size: 15px; margin-right: 6px; }
  #q { flex: 1; max-width: 460px; height: 34px; border: 1px solid var(--line); border-radius: 9px; padding: 0 12px; background: var(--panel); outline: none; }
  #q:focus { border-color: var(--accent); background: #fff; }
  .sp { flex: 1; }
  .btn { height: 34px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
  .btn:hover { background: var(--panel); }
  .btn.main { background: var(--text); color: #fff; border-color: var(--text); font-weight: 600; }
  .btn.main:disabled { background: #b3b3b3; border-color: #b3b3b3; cursor: default; }
  nav { padding: 8px; }
  nav div { display: flex; justify-content: space-between; padding: 7px 10px; border-radius: 8px; cursor: pointer; gap: 8px; }
  nav div:hover { background: #ececee; }
  nav div.on { background: var(--text); color: #fff; }
  nav div span:last-child { color: var(--muted); }
  nav .dot { color: var(--mark); }
  main { padding: 4px 16px 80px; }
  h3 { margin: 16px 0 4px; font-size: 12px; color: var(--muted); font-weight: 700; position: sticky; top: -4px; background: var(--bg); padding: 6px 0; z-index: 1; }
  h3 i { font-style: normal; font-weight: 500; margin-left: 8px; }
  .row { display: grid; grid-template-columns: minmax(120px, 210px) auto 1fr; gap: 12px; align-items: center; padding: 4px 8px; border-radius: 7px; }
  .row:hover { background: var(--panel); }
  .row.ch { background: var(--changed); box-shadow: inset 3px 0 0 var(--mark); }
  .lb { font-weight: 600; } .lb small { color: var(--muted); font-weight: 400; margin-left: 4px; }
  .ctl { display: flex; gap: 4px; align-items: center; }
  .s { width: 32px; height: 28px; border: 1px solid var(--line); background: #fff; border-radius: 7px; cursor: pointer; color: var(--muted); font-size: 11px; padding: 0; }
  .s:hover { color: var(--text); }
  .ctl input[type=text] { width: 78px; height: 28px; text-align: center; border: 1px solid var(--line); border-radius: 7px; font-weight: 600; font-variant-numeric: tabular-nums; outline: none; }
  .ctl input:focus { border-color: var(--accent); }
  .ctl input[type=color] { width: 34px; height: 28px; padding: 0 2px; border: 1px solid var(--line); border-radius: 7px; background: #fff; }
  .ctl select { height: 28px; border: 1px solid var(--line); border-radius: 7px; background: #fff; }
  .was { color: #9a7800; font-size: 12px; cursor: pointer; white-space: nowrap; } .was:hover { text-decoration: line-through; }
  .src { color: #b0b4ba; font: 11px ui-monospace, Menlo, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { color: var(--muted); text-align: center; padding: 60px 0; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 16px; }
  kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
  dialog { border: 1px solid var(--line); border-radius: 14px; padding: 20px; width: min(680px, 92vw); }
  dialog::backdrop { background: rgba(15,20,25,.25); }
  dialog h2 { margin: 0 0 12px; font-size: 16px; }
  dialog ul { margin: 0 0 12px; padding-left: 18px; max-height: 45vh; overflow: auto; line-height: 1.7; }
  dialog input { width: 100%; height: 36px; border: 1px solid var(--line); border-radius: 9px; padding: 0 12px; margin-bottom: 14px; }
  .acts { display: flex; justify-content: flex-end; gap: 8px; }
  aside { display: flex; flex-direction: column; align-items: center; background: var(--panel); height: 100%; }
  .bar { display: flex; gap: 6px; padding: 10px; width: 100%; }
  .bar input { flex: 1; height: 32px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; outline: none; min-width: 0; }
  .btn.pick.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .phone { flex: 1; min-height: 0; width: 100%; display: flex; justify-content: center; align-items: flex-start; overflow: hidden; }
  .device { position: relative; width: 390px; height: 844px; flex: none; border-radius: 44px; overflow: hidden; background: #fff; box-shadow: 0 0 0 1px var(--line), 0 10px 30px rgba(0,0,0,.08); transform-origin: top center; }
  .device iframe { width: 390px; height: 844px; border: 0; display: block; }
  /* iPhone status bar (47) and home indicator (34) over the app, which leaves room for them in ?capture */
  .sb { position: absolute; left: 0; right: 0; top: 0; height: 47px; pointer-events: none; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0 52px; font: 600 17px/1 -apple-system, 'SF Pro Text', Inter, sans-serif; color: #000; letter-spacing: -0.3px; }
  .sb svg { display: block; }
  .hi { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: #000; pointer-events: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer; background: #fff; font-size: 12px; }
  .chip.on { background: var(--text); color: #fff; border-color: var(--text); }
  .all { color: var(--accent); cursor: pointer; font-size: 12px; margin-left: 6px; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: #fff; padding: 9px 16px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.on { opacity: 1; } #toast.err { background: var(--err); }
</style>
</head>
<body>
<div class="app">
  <header>
    <b>Tweak</b>
    <input id="q" placeholder="Поиск: заголовок, отступ, fontSize, title…   ( / )" autocomplete="off" />
    <div class="sp"></div>
    <button class="btn" id="discard">Отменить всё</button>
    <button class="btn main" id="send" disabled>Отправить</button>
  </header>
  <div id="dock"></div>
</div>
<div id="parts" hidden>
  <section class="panel" data-id="screens"><div class="ph">Экраны</div><div class="pb"><nav id="screens"></nav></div></section>
  <section class="panel" data-id="props"><div class="ph">Свойства</div><div class="pb"><main id="main"><div class="empty">Выберите экран или кликните «◎ Выбрать» и элемент в превью.</div></main></div></section>
  <section class="panel" data-id="preview"><div class="ph">Превью</div><div class="pb"><aside>
    <div class="bar"><button class="btn pick" id="pick" title="Кликните по элементу в превью">◎ Выбрать</button><input id="path" value="/" title="Экран приложения (адрес)" /><button class="btn" id="reload" title="Перезагрузить превью">↻</button></div>
    <div class="phone"><div class="device"><iframe id="app"></iframe>
      <div class="sb"><span>9:41</span><span style="display:flex;gap:6px;align-items:center">
        <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.6c2.3 0 4.4.9 6 2.4l1.1-1.1A10 10 0 0 0 8 1 10 10 0 0 0 .9 3.9L2 5a8.6 8.6 0 0 1 6-2.4Zm0 3.2c1.4 0 2.7.5 3.7 1.4l1.1-1.1A7 7 0 0 0 8 4.2a7 7 0 0 0-4.8 1.9l1.1 1.1c1-.9 2.3-1.4 3.7-1.4Zm0 3.2c-.6 0-1.2.2-1.6.6L8 11.2l1.6-1.6c-.4-.4-1-.6-1.6-.6Z"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#000" opacity=".35"/><rect x="2" y="2" width="20" height="9" rx="2"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" opacity=".4"/></svg>
      </span></div><div class="hi"></div></div></div>
  </aside></div></section>
<dialog id="dlg">
  <h2>Отправить изменения</h2>
  <ul id="dlgList"></ul>
  <input id="note" placeholder="Комментарий (необязательно)" />
  <div class="acts"><button class="btn" id="cancel">Отмена</button><button class="btn main" id="ok">Отправить</button></div>
</dialog>
<div id="toast"></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const api = async (path, body) => {
  const r = await fetch('api/' + path, body && { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};
const toast = (m, err) => { const t = $('#toast'); t.textContent = m; t.className = 'on' + (err ? ' err' : ''); clearTimeout(toast.t); toast.t = setTimeout(() => (t.className = ''), err ? 4000 : 1800); };
const round = (v) => Math.round(v * 1000) / 1000;
let screens = [], cur = null, changes = [];
const changed = (rel, key) => changes.find((c) => c.rel === rel && c.key === key);

function setStatus(s) {
  changes = s.changes;
  $('#send').disabled = !changes.length;
  $('#send').textContent = changes.length ? `Отправить (${changes.length})` : 'Отправить';
  drawScreens();
}
function drawScreens() {
  const touched = new Set(changes.map((c) => c.rel));
  $('#screens').innerHTML = screens.map((s) => `<div data-rel="${esc(s.rel)}" class="${cur === s.rel ? 'on' : ''}" title="${esc(s.rel)}"><span>${touched.has(s.rel) ? '<span class="dot">● </span>' : ''}${esc(s.name)}</span><span>${s.count}</span></div>`).join('');
}
$('#screens').onclick = (e) => { const d = e.target.closest('[data-rel]'); if (d) { $('#q').value = ''; open(d.dataset.rel); } };

let chain = [];
async function open(rel, focus) {
  cur = rel; location.hash = encodeURIComponent(rel); drawScreens();
  const name = screens.find((s) => s.rel === rel)?.name ?? rel;
  let items = (await api('values?file=' + encodeURIComponent(rel))).map((i) => ({ ...i, rel, screen: name }));
  if (focus && focus.keys.length) items = items.filter((i) => focus.keys.includes(i.group));
  const next = focus?.auto && !items.length && chain[chain.indexOf(focus.raw) + 1];
  if (next) return pickFrom(next, true);
  draw(items, false);
  if (focus) {
    const head = document.createElement('div');
    head.className = 'chips';
    head.innerHTML = chain.map((c, k) => `<span class="chip${c === focus.raw ? ' on' : ''}" data-k="${k}">${esc(c.split('|')[1] || 'элемент')}</span>`).join('') + `<span class="all">весь экран</span>`;
    $('#main').prepend(head);
    head.onclick = (e) => { if (e.target.dataset.k) pickFrom(chain[e.target.dataset.k]); if (e.target.matches('.all')) open(rel); };
    if (!items.length) $('#main').insertAdjacentHTML('beforeend', '<div class="empty">У этого элемента нет настраиваемых значений — выберите элемент выше по цепочке.</div>');
  }
}
function pickFrom(raw, auto) {
  const [rel, keys, line] = raw.split('|');
  open(rel, { raw, auto, keys: keys ? keys.split(',') : [], line: +line });
}
let st;
$('#q').oninput = () => { clearTimeout(st); st = setTimeout(async () => { const q = $('#q').value.trim(); if (!q) return cur && open(cur); draw(await api('search?q=' + encodeURIComponent(q)), true); }, 150); };
document.onkeydown = (e) => { if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); $('#q').select(); } };

function draw(items, many) {
  if (!items.length) return ($('#main').innerHTML = '<div class="empty">Ничего не найдено.</div>');
  let html = '', last = '';
  for (const i of items) {
    const g = (many ? i.screen + '|' : '') + i.group;
    if (g !== last) { html += `<h3>${esc(i.group)}${many ? `<i>${esc(i.screen)}</i>` : ''}</h3>`; last = g; }
    html += row(i);
  }
  $('#main').innerHTML = html + '<p class="hint"><kbd>↑</kbd> <kbd>↓</kbd> ±1 · с <kbd>Shift</kbd> ±0.1 · с <kbd>Alt</kbd> ±0.05 · жёлтое «было» — вернуть как было · изменения сразу видны на телефоне, «Отправить» — сохранить их в проект</p>';
}
function row(i) {
  const c = changed(i.rel, i.key);
  let ctl;
  if (i.kind === 'num') ctl = `<button class="s" data-d="-1">−1</button><button class="s" data-d="-0.1">−.1</button><input type="text" value="${i.value}"><button class="s" data-d="0.1">+.1</button><button class="s" data-d="1">+1</button>`;
  else if (i.kind === 'color') { const v = i.value.length === 4 ? '#' + [...i.value.slice(1)].map((x) => x + x).join('') : i.value.slice(0, 7); ctl = `<input type="color" value="${v}"><input type="text" value="${esc(i.value)}">`; }
  else ctl = `<select>${['300', '400', '500', '600', '700', '800', '900'].map((w) => `<option${w === i.value ? ' selected' : ''}>${w}</option>`).join('')}</select>`;
  return `<div class="row${c ? ' ch' : ''}" data-rel="${esc(i.rel)}" data-key="${esc(i.key)}" data-kind="${i.kind}">
    <div class="lb">${esc(i.label || i.prop)}<small>${esc(i.prop)}</small></div>
    <div class="ctl">${ctl}${c ? `<span class="was">было ${esc(c.from)}</span>` : ''}</div>
    <div class="src" title="строка ${i.line}">${esc(i.src)}</div></div>`;
}

const timers = new Map();
function apply(r, value, now) {
  const id = r.dataset.rel + '|' + r.dataset.key;
  clearTimeout(timers.get(id));
  timers.set(id, setTimeout(async () => {
    try {
      setStatus(await api('set', { file: r.dataset.rel, key: r.dataset.key, value }));
      const c = changed(r.dataset.rel, r.dataset.key);
      r.classList.toggle('ch', !!c);
      let w = r.querySelector('.was');
      if (c && !w) { w = document.createElement('span'); w.className = 'was'; r.querySelector('.ctl').append(w); }
      if (w) c ? (w.textContent = 'было ' + c.from) : w.remove();
    } catch (e) { toast(e.message, true); }
  }, now ? 0 : 200));
}
const M = $('#main');
M.onclick = (e) => {
  const r = e.target.closest('.row'); if (!r) return;
  if (e.target.matches('.s')) { const t = r.querySelector('input[type=text]'); t.value = round(+t.value + +e.target.dataset.d); apply(r, t.value); }
  if (e.target.matches('.was')) {
    const c = changed(r.dataset.rel, r.dataset.key); if (!c) return;
    r.querySelectorAll('input[type=text], select').forEach((x) => (x.value = c.from));
    const col = r.querySelector('input[type=color]'); if (col && c.from.length === 7) col.value = c.from;
    apply(r, c.from, true);
  }
};
M.oninput = (e) => {
  const r = e.target.closest('.row'); if (!r) return;
  const v = e.target.value.trim();
  if (r.dataset.kind === 'num') { if (v !== '' && Number.isFinite(+v)) apply(r, v); }
  else if (r.dataset.kind === 'color') {
    if (e.target.type === 'color') { r.querySelector('input[type=text]').value = v.toUpperCase(); apply(r, v.toUpperCase()); }
    else if (/^#([0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(v)) { if (v.length === 7) r.querySelector('input[type=color]').value = v; apply(r, v); }
  }
};
M.onchange = (e) => { const r = e.target.closest('.row'); if (r && e.target.tagName === 'SELECT') apply(r, e.target.value, true); };
M.onkeydown = (e) => {
  if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  const r = e.target.closest('.row'); if (!r || r.dataset.kind !== 'num') return;
  e.preventDefault();
  const step = e.altKey ? 0.05 : e.shiftKey ? 0.1 : 1;
  e.target.value = round(+e.target.value + (e.key === 'ArrowUp' ? step : -step));
  apply(r, e.target.value);
};

$('#send').onclick = () => {
  $('#dlgList').innerHTML = changes.map((c) => `<li>${esc(c.screen)} · ${esc(c.group)} · ${esc(c.label || c.prop)}: ${esc(c.from)} → <b>${esc(c.to)}</b></li>`).join('');
  $('#note').value = ''; $('#dlg').showModal(); $('#note').focus();
};
$('#cancel').onclick = () => $('#dlg').close();
$('#note').onkeydown = (e) => e.key === 'Enter' && $('#ok').click();
$('#ok').onclick = async () => {
  $('#ok').disabled = true;
  try { const r = await api('send', { note: $('#note').value }); $('#dlg').close(); toast('Отправлено: ' + r.commit); setStatus(await api('status')); if (cur) open(cur); }
  catch (e) { toast(e.message, true); }
  $('#ok').disabled = false;
};
$('#discard').onclick = async () => {
  if (!changes.length || !confirm(`Вернуть ${changes.length} знач. как было?`)) return;
  try { setStatus(await api('discard', {})); if (cur) open(cur); toast('Вернул как было'); } catch (e) { toast(e.message, true); }
};
// preview: the web build of the app (mock data) in a phone-sized frame; ◎ picks an element in it
let APP = '';
const frame = $('#app');
// ---------- panels: drag a header onto another panel (above / below / beside); drag the gaps to resize ----------
const DEFAULT = { cols: [{ w: 34, panels: [{ id: 'screens', h: 30 }, { id: 'props', h: 70 }] }, { w: 66, panels: [{ id: 'preview', h: 100 }] }] };
let layout;
try { layout = JSON.parse(localStorage.getItem('tweak-layout')) || DEFAULT; } catch { layout = DEFAULT; }
const ids = layout.cols.flatMap((c) => c.panels.map((p) => p.id));
if (ids.sort().join() !== 'preview,props,screens') layout = DEFAULT;
const save = () => { try { localStorage.setItem('tweak-layout', JSON.stringify(layout)); } catch {} };
const part = (id) => document.querySelector(`.panel[data-id="${id}"]`);
function norm() {
  layout.cols = layout.cols.filter((c) => c.panels.length);
  const W = layout.cols.reduce((a, c) => a + c.w, 0);
  layout.cols.forEach((c) => { c.w = (c.w / W) * 100; const H = c.panels.reduce((a, p) => a + p.h, 0); c.panels.forEach((p) => (p.h = (p.h / H) * 100)); });
}
function build() {
  norm();
  const dock = $('#dock');
  [...dock.querySelectorAll('.panel')].forEach((p) => $('#parts').append(p));
  dock.innerHTML = '';
  layout.cols.forEach((c, ci) => {
    if (ci) dock.append(splitter('v', ci));
    const col = document.createElement('div');
    col.className = 'col'; col.style.flex = `${c.w} 1 0`;
    c.panels.forEach((p, pi) => {
      if (pi) col.append(splitter('h', ci, pi));
      const el = part(p.id); el.style.flex = `${p.h} 1 0`; col.append(el);
    });
    dock.append(col);
  });
  save(); requestAnimationFrame(fit);
}
function splitter(dir, ci, pi) {
  const s = document.createElement('div');
  s.className = dir === 'v' ? 'vsplit' : 'hsplit';
  s.onpointerdown = (e) => {
    e.preventDefault(); document.body.classList.add('dragging');
    const a = dir === 'v' ? layout.cols[ci - 1] : layout.cols[ci].panels[pi - 1];
    const b = dir === 'v' ? layout.cols[ci] : layout.cols[ci].panels[pi];
    const k = dir === 'v' ? 'w' : 'h';
    const box = (dir === 'v' ? $('#dock') : s.parentElement).getBoundingClientRect();
    const total = dir === 'v' ? box.width : box.height, start = dir === 'v' ? e.clientX : e.clientY, a0 = a[k], b0 = b[k];
    const move = (ev) => {
      const d = (((dir === 'v' ? ev.clientX : ev.clientY) - start) / total) * 100;
      const da = Math.max(-a0 + 8, Math.min(b0 - 8, d));
      a[k] = a0 + da; b[k] = b0 - da;
      s.previousElementSibling.style.flex = `${a[k]} 1 0`; s.nextElementSibling.style.flex = `${b[k]} 1 0`; fit();
    };

const dropBox = document.createElement('div'); dropBox.className = 'drop';
document.addEventListener('pointerdown', (e) => {
  const ph = e.target.closest('.ph'); if (!ph) return;

  let target = null;
  document.body.classList.add('dragging');
  const move = (ev) => {
    target = null; dropBox.remove();
    const over = document.elementsFromPoint(ev.clientX, ev.clientY).find((x) => x.classList?.contains('panel'));
    if (!over || over.dataset.id === id) return;
    const r = over.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width, y = (ev.clientY - r.top) / r.height;
    const side = x < 0.25 ? 'left' : x > 0.75 ? 'right' : y < 0.5 ? 'top' : 'bottom';
    target = { id: over.dataset.id, side };
    const box = { left: [r.left, r.top, r.width / 2, r.height], right: [r.left + r.width / 2, r.top, r.width / 2, r.height], top: [r.left, r.top, r.width, r.height / 2], bottom: [r.left, r.top + r.height / 2, r.width, r.height / 2] }[side];

    removeEventListener('pointermove', move); removeEventListener('pointerup', up);
    document.body.classList.remove('dragging'); dropBox.remove();

    const ci = layout.cols.findIndex((c) => c.panels.some((p) => p.id === target.id));
    const col = layout.cols[ci], pi = col.panels.findIndex((p) => p.id === target.id);
    if (target.side === 'top' || target.side === 'bottom') {
      const t = col.panels[pi]; moved.h = t.h / 2; t.h /= 2;
      col.panels.splice(target.side === 'top' ? pi : pi + 1, 0, moved);
    } else {
      moved.h = 100;
      layout.cols.splice(target.side === 'left' ? ci : ci + 1, 0, { w: col.w / 2, panels: [moved] }); col.w /= 2;

  };

});
build();

function fit() { const h = $('.phone').clientHeight - 16, w = $('.phone').clientWidth - 16; if (h > 0 && w > 0) $('.device').style.transform = `scale(${Math.min(1, h / 844, w / 390)})`; }
addEventListener('resize', fit);
function go() { const p = $('#path').value.trim() || '/'; frame.src = APP + p + (p.includes('?') ? '&' : '?') + 'capture'; }
$('#path').onkeydown = (e) => e.key === 'Enter' && go();

let picking = false;

addEventListener('message', (e) => {

(async () => {
