name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: puzzle
          POSTGRES_PASSWORD: puzzle
          POSTGRES_DB: puzzle
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U puzzle -d puzzle"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://puzzle:puzzle@localhost:5432/puzzle?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm run build
      - run: node ./node_modules/prisma/build/index.js migrate deploy
      # Unit tests plus the integration test against the Postgres / Redis services above.
      - run: npm run test:all

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      # Typed routes and expo-env.d.ts are generated by the dev server; start it briefly first.
      - run: (timeout 60 npx expo start --port 8099 > /dev/null 2>&1; true)
        env:
          CI: "1"
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npx jest --ci
      - run: npx expo export --platform ios --platform android --output-dir /tmp/bundle-check
